<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Snake</h1>
      <p class="instructions">Use the arrow keys to move. Eat food, avoid walls, yourself, and the blue AI snakes.</p>
      <section class="hud" aria-label="Scoreboard">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best-score">0</strong></span>
      </section>
      <section class="settings" aria-label="Game settings">
        <label for="ai-snake-count">AI snakes</label>
        <input id="ai-snake-count" type="number" min="1" max="18" value="1" />
      </section>
      <canvas
        id="game"
        width="400"
        height="400"
        aria-label="Snake game board"
        role="img"
      ></canvas>
      <div class="actions" role="group" aria-label="Game actions">
        <button id="restart" type="button">Restart</button>
        <button id="capture-photo" class="secondary-action" type="button">Take Photo</button>
      </div>
      <section class="photo-panel" aria-live="polite">
        <p id="photo-status" class="photo-status">No photo taken yet.</p>
        <img
          id="photo-preview"
          alt="Preview of the latest captured Snake game photo"
          width="400"
          height="400"
          hidden
        />
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
